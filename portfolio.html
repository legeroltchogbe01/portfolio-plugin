<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="robots" content="index, follow">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0e0d0b; color: #f4efe8; }
    .box { text-align: center; padding: 24px; max-width: 420px; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid #2e2923; border-top-color: #e8743b; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #b9b0a4; margin: 0 0 20px; line-height: 1.5; }
    a { color: #e8743b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box" id="status">
    <div class="spinner" aria-hidden="true"></div>
    <p>Chargement du portfolio…</p>
  </div>

  <script src="/config.js"></script>
  <script src="/engine.js"></script>
  <script src="/themes.js"></script>
  <script>
    /*
     * Page publique : site.com/<slug>
     * Render réécrit toutes les adresses inconnues vers cette page (render.yaml).
     * On lit la version publiée du portfolio puis on l'affiche avec le même
     * moteur que l'éditeur : le résultat est identique à l'aperçu.
     */
    (function () {
      var cfg = window.PORTFOLIO_CONFIG || {};
      var slug = decodeURIComponent(location.pathname.split('/').filter(Boolean)[0] || '').toLowerCase();

      function show(title, text) {
        document.title = title;
        var box = document.getElementById('status');
        box.innerHTML = '<h1></h1><p></p><a href="/">Accueil</a>';
        box.querySelector('h1').textContent = title;
        box.querySelector('p').textContent = text;
      }

      if (!/^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$/.test(slug)) {
        return show('Page introuvable', 'Cette adresse ne correspond à aucun portfolio.');
      }
      if (!cfg.supabaseUrl || !cfg.supabaseKey) {
        return show('Site non configuré', 'Renseignez config.js pour afficher les portfolios publiés.');
      }

      var url = cfg.supabaseUrl.replace(/\/$/, '') + '/rest/v1/published_portfolios' +
        '?select=data,theme&slug=eq.' + encodeURIComponent(slug) + '&limit=1';

      fetch(url, { headers: { apikey: cfg.supabaseKey, Accept: 'application/json' } })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (rows) {
          if (!rows || !rows.length) {
            return show('Portfolio introuvable', 'Ce portfolio n’existe pas ou n’est pas encore publié.');
          }
          var row = rows[0];
          var html = window.PortfolioEngine.generatePortfolio(row.data, row.theme).html;
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function (err) {
          console.error(err);
          show('Chargement impossible', 'Le portfolio n’a pas pu être chargé. Vérifiez votre connexion puis rechargez la page.');
        });
    })();
  </script>
</body>
</html>
